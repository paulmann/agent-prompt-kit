name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Prompt contracts (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Structural contracts
        run: python tools/prompt_lint.py

      - name: Machine-readable findings
        run: python tools/prompt_lint.py --json > lint.json

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-findings
          path: lint.json